services:
  db2:
    build:
      context: .
      args:
        PRIYA_PASSWORD: ${PRIYA_PASSWORD:?set PRIYA_PASSWORD in .env}
        ARJUN_PASSWORD: ${ARJUN_PASSWORD:?set ARJUN_PASSWORD in .env}
    image: custodian-db2:12.1.5.0
    container_name: custodian-db2
    privileged: true
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      DBNAME: ${DB2_DATABASE:-CUSTDB}
      SAMPLEDB: "false"
      REPODB: "false"
      AUTOCONFIG: "false"
      ARCHIVE_LOGS: "false"
    volumes:
      - db2data:/database   # named volume: never a Windows bind mount
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_DATABASE:-CUSTDB}' >/dev/null"]
      interval: 30s
      timeout: 30s
      retries: 40
      start_period: 120s
volumes:
  db2data:
