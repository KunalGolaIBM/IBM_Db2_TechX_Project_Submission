version: '3.8'

services:
  db2:
    image: icr.io/db2_community/db2:12.1.2.0
    container_name: db2_kisan_mitra
    restart: unless-stopped
    privileged: true
    environment:
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=KisanMitra2026!
      - DBNAME=KISANMIT
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
      - SAMPLE_DB=false
      - PERSISTENT_STORAGE=true
      - ARCHIVE_LOGS=false
      - LICENSE=accept
    ports:
      - "50000:50000"
    volumes:
      - db2data:/database
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to KISANMIT && db2 terminate'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  db2data:
    driver: local
