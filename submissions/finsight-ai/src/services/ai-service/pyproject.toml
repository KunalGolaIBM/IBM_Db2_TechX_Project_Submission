[project]
name = "finsight-ai-service"
version = "0.1.0"
description = "FinSight AI Python Service — LangChain & IBM Db2 Financial Intelligence"
authors = [{ name = "Abhinav Khokhar" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-db2>=1.0.0",
    "ibm-db>=3.2.0",
    "fastembed>=0.3.0",
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
