[package]
name = "finsight-rust-api"
version = "0.1.0"
edition = "2021"
authors = ["FinSight AI Team"]
description = "Production-grade Axum API Gateway with Argon2id auth, SHA-256 session management, and tenant isolation for FinSight AI"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
thiserror = "1.0"
cookie = "0.18"

# Version pins for Rust 1.85 compatibility
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
time = "=0.3.36"
time-core = "=0.1.2"
time-macros = "=0.2.18"
idna_adapter = "=1.2.0"
encoding_rs = "=0.8.34"
icu_collections = "=1.5.0"
icu_normalizer = "=1.5.0"
icu_properties = "=1.5.0"
icu_provider = "=1.5.0"
hmac = "0.12"
subtle = "2.6"
