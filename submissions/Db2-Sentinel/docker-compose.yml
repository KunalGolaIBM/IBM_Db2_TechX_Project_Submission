version: '3.8'

# ==============================================================================
# Db2-Sentinel Docker Compose
# IBM Db2 Community Edition (v11.5.x) on Port 50000
# Zero-config setup for IBM Db2 TechX Db2Hack 2026
# ==============================================================================

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2-sentinel-core
    restart: unless-stopped
    privileged: true
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2PASSWORD=SentinelDb2_2026!
      - DBNAME=SENTINEL
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
      - ARCHIVE_LOGS=false
      - AUTOCONFIG=false
    ports:
      - "50000:50000"
    volumes:
      - ./db2_data:/database
      - ./db/init_schema.sql:/var/custom/init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to SENTINEL' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
