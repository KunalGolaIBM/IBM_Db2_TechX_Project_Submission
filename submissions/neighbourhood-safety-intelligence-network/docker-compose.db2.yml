# Override that runs the backend against IBM Db2 Community Edition.
# First start of the Db2 container takes ~3-5 minutes while the instance and database are created.

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: nsin_db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-change_me_db2}
      DBNAME: NSIN
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      PERSISTENT_HOME: "true"
      ARCHIVE_LOGS: "false"
    volumes:
      - db2-data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c \"db2 connect to NSIN\" > /dev/null"]
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 180s

  backend:
    environment:
      DATABASE_MODE: db2
      DB2_HOST: db2
      DB2_PORT: "50000"
      DB2_DATABASE: NSIN
      DB2_USER: db2inst1
      DB2_PASSWORD: ${DB2_PASSWORD:-change_me_db2}
      DB2_SECURITY: ""
      ENABLE_VECTOR_SEARCH: "true"
    depends_on:
      db2:
        condition: service_healthy
    restart: on-failure

volumes:
  db2-data:
