services:
  db2:
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64   # required on Apple Silicon (runs under emulation)
    container_name: db2-cortex
    privileged: true
    ports: ["50000:50000"]
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?copy .env.example to .env and set DB2_PASSWORD first}
      DBNAME: ${DB2_DATABASE:-CORTEX}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
    volumes: ["db2data:/database"]
volumes:
  db2data:
