services:
  db2:
    image: icr.io/db2_community/db2:12.1.2.0
    container_name: bakebox-db2
    privileged: true
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Set DB2_PASSWORD in .env before starting Docker}
      DBNAME: ${DB2_DATABASE:-IBMDB201}
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - db2_data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_DATABASE:-IBMDB201} && db2 terminate'"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  db2_data:
