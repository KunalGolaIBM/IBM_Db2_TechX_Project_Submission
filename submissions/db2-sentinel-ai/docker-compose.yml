version: '3.8'

services:
  db2server:
    image: icr.io/db2_community/db2:latest
    container_name: db2_sentinel
    restart: always
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=YourSecurePassword123!
      - DBNAME=testdb
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
    volumes:
      - db2_sentinel_data:/database

volumes:
  db2_sentinel_data:
