[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db2-privacy-copilot"
version = "0.1.0"
description = "Agentic DPDP-compliance copilot for IBM Db2"
requires-python = ">=3.11"
dependencies = [
    "ibm_db>=3.2.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-db2>=1.0.0",
    "sentence-transformers>=2.2.0",
    "crewai>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "networkx>=3.2",
    "faker>=20.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.90.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "pre-commit>=3.5.0",
]

ui = [
    "streamlit>=1.28.0",
]

[tool.setuptools]
packages = ["app", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["app", "eval", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ibm_db.*",
    "ibm_db_dbi.*",
    "crewai.*",
    "langchain.*",
    "langchain_community.*",
    "sentence_transformers.*",
    "networkx.*",
    "faker.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=html --cov-report=term-missing"
markers = ["integration: requires a live IBM Db2 database"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/test_*.py"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert_used (fine in tests)
