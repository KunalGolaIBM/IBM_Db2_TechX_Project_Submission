[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parity"
version = "1.0.0"
description = "Agentic differential testing for safe migration to IBM Db2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Parity" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
db = [
    "ibm_db>=3.2",
    "psycopg[binary]>=3.2",
]
agents = [
    "crewai>=0.100",
]

[project.scripts]
parity = "parity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
