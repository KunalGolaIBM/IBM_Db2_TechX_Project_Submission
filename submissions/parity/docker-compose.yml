services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: parity_source
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity -d parity_source"]
      interval: 5s
      timeout: 5s
      retries: 10

  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: change-me
      DBNAME: parity
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      SAMPLEDB: "false"
      REPODB: "false"
      PERSISTENT_HOME: "true"
    ports:
      - "50000:50000"
    volumes:
      - db2data:/database
    healthcheck:
      test: ["CMD-SHELL", "db2look -d parity -i >/dev/null 2>&1 || db2 create db parity >/dev/null 2>&1; echo ok"]
      interval: 15s
      timeout: 10s
      retries: 20
    privileged: true

volumes:
  db2data:
