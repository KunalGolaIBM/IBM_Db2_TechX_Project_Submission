version: "3.9"

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: mood_db2
    privileged: true
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=moodmusic123
      - DBNAME=MDMUSIC
    ports:
      - "50000:50000"
    volumes:
      - db2_data:/database
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to MDMUSIC"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build: .
    container_name: mood_backend
    depends_on:
      db2:
        condition: service_healthy
    environment:
      - DB2_DATABASE=MDMUSIC
      - DB2_HOST=db2
      - DB2_PORT=50000
      - DB2_USER=db2inst1
      - DB2_PASSWORD=moodmusic123
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MUSIC_DIR=/app/music
    ports:
      - "8000:8000"
    volumes:
      - ./music:/app/music
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  db2_data:

