version: '3.8'

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2server
    restart: always
    privileged: true
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=Db2Hack2026!
      - DBNAME=testdb
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
    ports:
      - "50000:50000"
    volumes:
      - db2_data:/database

volumes:
  db2_data:
