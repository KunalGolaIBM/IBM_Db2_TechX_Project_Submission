# IBM Db2 Community Edition for local development.
# Run via `make db-up` (which passes --env-file .env) so the password comes from the
# untracked .env file next to the Makefile. IBM ships this image for linux/amd64; on Apple Silicon it runs
# under x86_64 emulation (Colima with QEMU binfmt, Rosetta OFF) - see README "Apple Silicon setup".
name: metricguard

services:
  db2:
    image: icr.io/db2_community/db2:${DB2_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: metricguard-db2
    hostname: db2server
    privileged: true            # required by the Db2 Community Edition image
    restart: unless-stopped
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Set DB2_PASSWORD in .env}
      DBNAME: ${DB2_DATABASE:-MGDB}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      SAMPLEDB: "false"
      REPODB: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - metricguard_db2_data:/database
    shm_size: 1g

volumes:
  metricguard_db2_data:
