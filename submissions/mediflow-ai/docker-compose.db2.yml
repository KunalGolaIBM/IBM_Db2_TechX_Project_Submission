services:
  db2:
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64
    container_name: mediflow-db2
    privileged: true
    restart: unless-stopped
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Set DB2_PASSWORD in the local .env file}
      DBNAME: ${DB2_DATABASE:-MEDIFLOW}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
    volumes:
      - mediflow-db2-data:/database
    shm_size: 1gb

volumes:
  mediflow-db2-data:
