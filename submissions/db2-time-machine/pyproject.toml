[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db2-time-machine"
version = "1.0.0"
description = "A LangGraph multi-agent root-cause analyst that time-travels through IBM Db2 system-period temporal tables."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["langgraph>=0.2.50", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "ibm_db>=3.2"]

[project.optional-dependencies]
sqlalchemy = ["ibm_db_sa>=0.4", "sqlalchemy>=1.4,<2.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
time_machine = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
