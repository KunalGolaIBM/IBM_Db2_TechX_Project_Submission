# docker compose up  ->  Db2 + Ollama (IBM Granite) + AQI Truth on http://localhost:8000
# First start: Db2 creates its database (~5-10 min) and the setup job downloads ~2.5 GB of Granite GGUF.
services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    privileged: true
    restart: unless-stopped
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD}
      DBNAME: ${DB2_DATABASE:-AQIDB}
      DB2_READER_PASSWORD: ${DB2_READER_PASSWORD}
      DB2_APP_PASSWORD: ${DB2_APP_PASSWORD:-}
    volumes:
      - db2data:/database
      - ./docker/db2-custom:/var/custom
    ports: ["50000:50000"]
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_DATABASE:-AQIDB}' >/dev/null && id aqreader"]
      interval: 30s
      timeout: 30s
      retries: 40
      start_period: 120s

  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"      # keep Granite loaded; a reload on CPU costs 10-100 s
    entrypoint: ["/bin/sh", "/entry.sh"]
    volumes:
      - models:/models
      - ollama:/root/.ollama
      - ./ollama:/modelfiles:ro
      - ./docker/ollama-entry.sh:/entry.sh:ro

  setup:
    build: .
    env_file: .env
    command: >
      sh -c "python scripts/pull_models.py /models &&
             python src/load.py data/sample 2025-10-01 2025-10-31 --if-empty"
    volumes:
      - models:/models
    depends_on:
      db2: {condition: service_healthy}
      ollama: {condition: service_started}

  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}

  # Public HTTPS front for a hosted demo: `DOMAIN=your.host docker compose --profile public up -d`
  caddy:
    image: caddy:2.8.4
    profiles: ["public"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8000
    ports: ["80:80", "443:443"]
    volumes:
      - caddy:/data
    restart: unless-stopped
    depends_on: [app]

volumes:
  caddy:
  db2data:
  models:
  ollama:
