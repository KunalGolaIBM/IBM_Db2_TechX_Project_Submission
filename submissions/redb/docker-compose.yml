services:
  db2:
    image: icr.io/db2_community/db2:latest   # needs >= 12.1.2 for VECTOR
    platform: linux/amd64
    container_name: redb-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-redb_Passw0rd}
      DBNAME: REDB
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      PERSISTENT_HOME: "true"
    ports: ["50000:50000"]
    volumes: [db2data:/database]
volumes: { db2data: {} }
