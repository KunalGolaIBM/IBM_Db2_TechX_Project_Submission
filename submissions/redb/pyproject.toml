[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redb"
version = "1.0.0"
description = "AI agent that tunes IBM Db2 and proves every fix"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "ibm_db>=3.2",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "pydantic>=2",
  "streamlit>=1.35",
  "pandas>=2",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redb = "redb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
