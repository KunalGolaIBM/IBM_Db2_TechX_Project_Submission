# IBM Db2 Community Edition 12.1.2+ (needed for the VECTOR data type).
# First start takes 5-10 minutes; wait for "(*) Setup has completed." in `docker logs -f payguard-db2`.
services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: payguard-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-change-me-Db2pass1}
      DBNAME: PAYGUARD
      BLU: "false"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - db2data:/database
volumes:
  db2data:
