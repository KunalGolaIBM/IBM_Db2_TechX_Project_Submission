# Continuous integration for Hotel Ops Copilot (runs in the standalone repo, github.com/clarkf19/hotel-ops-copilot).
#
#   unit  - lint + every test that needs neither Db2 nor an LLM key (~2 min)
#   db2   - starts IBM Db2 Community Edition, loads the hotel, then runs the full suite against the live
#           database, the 29 live proofs (python src/verify.py) and a 1,000-proposal guardrail fuzz
#
# It also runs every day: the demo data is generated relative to "today", so a daily run proves the
# checks hold on any date. No API keys are used; the Db2 passwords are random per run and never stored.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and offline tests (no Db2, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests that need no database (Db2 suites skip themselves)
        run: python -m pytest -q -rs

  db2:
    name: Live IBM Db2 - full suite, 28 proofs, guardrail fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB2_HOST: localhost
      DB2_PORT: "50000"
      DB2_DATABASE: HOTELDB
      DB2_USER: db2inst1
      DB2_AGENT_USER: opsagent
      DB2_SECURITY: "false"
      LLM_PROVIDER: gemini  # no key: the app's no-LLM mode; nothing here calls a model
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Random Db2 passwords for this run only
        run: |
          for v in DB2_PASSWORD DB2_AGENT_PASSWORD; do
            p="Ci$(openssl rand -hex 10)"
            echo "::add-mask::$p"
            echo "$v=$p" >> "$GITHUB_ENV"
          done
      - name: Start IBM Db2 Community Edition (scripts/run_db2.sh, same as the README)
        run: |
          printf 'DB2_PORT=%s\nDB2_DATABASE=%s\nDB2_USER=%s\nDB2_PASSWORD=%s\nDB2_AGENT_USER=%s\nDB2_AGENT_PASSWORD=%s\n' \
            "$DB2_PORT" "$DB2_DATABASE" "$DB2_USER" "$DB2_PASSWORD" "$DB2_AGENT_USER" "$DB2_AGENT_PASSWORD" > .env
          bash scripts/run_db2.sh
      - name: Install dependencies (while Db2 initialises)
        run: pip install -r requirements.txt pytest-cov
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Wait for Db2 setup and the least-privileged agent user
        run: |
          for i in $(seq 1 120); do
            if docker logs hotelops-db2 2>&1 | grep -q "Setup has completed"; then
              docker exec hotelops-db2 id "$DB2_AGENT_USER" && { echo "Db2 ready after ~$((i * 10)) s"; exit 0; }
            fi
            sleep 10
          done
          echo "Db2 did not finish setup"; docker logs --tail 60 hotelops-db2; exit 1
      - name: Create the schema, load the hotel, embed reviews, apply security
        run: python src/setup_db.py
      - name: Full test suite against the live Db2 (with coverage)
        run: python -m pytest -q -rs --cov=src/hotelops --cov=src/verify.py --cov-report=term
      - name: 29 live proofs (python src/verify.py)
        run: python src/verify.py
      - name: Guardrail fuzz (1,000 random proposals vs an independent oracle)
        run: python src/fuzz_guardrails.py 1000
      - name: Db2 logs on failure
        if: failure()
        run: docker logs --tail 120 hotelops-db2
