# Hotel Ops Copilot: IBM Db2 Community Edition + the app.
# Values come from ./.env (copy .env.example first).
#   docker compose up -d          # Db2 + app on http://localhost:8501 (no local Python needed)
#   docker compose up -d db2      # Db2 only, if you run the Python app yourself
services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: hotelops-db2
    privileged: true
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: ${DB2_USER:-db2inst1}
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      DBNAME: ${DB2_DATABASE:-HOTELDB}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      PERSISTENT_HOME: "true"
      AGENT_USER: ${DB2_AGENT_USER:-opsagent}
      AGENT_PASSWORD: ${DB2_AGENT_PASSWORD:?set DB2_AGENT_PASSWORD in .env}
      SECADM_USER: ${DB2_SECADM_USER:-hotelsec}
      SECADM_PASSWORD: ${DB2_SECADM_PASSWORD:-}
    volumes:
      - db2data:/database
      # scripts in /var/custom run once Db2 setup has completed
      - ./docker/custom:/var/custom
  app:
    build: .
    container_name: hotelops-app
    env_file: .env
    environment:
      DB2_HOST: db2
      DB2_PORT: "50000"
    ports:
      - "8501:8501"
    depends_on:
      - db2
    restart: unless-stopped
volumes:
  db2data:
