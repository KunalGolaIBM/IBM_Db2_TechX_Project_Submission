services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    container_name: annasetu-db2
    privileged: true
    restart: unless-stopped
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Copy .env.example to .env and set DB2_PASSWORD}
      DBNAME: ${DB2_NAME:-ANNASETU}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
    volumes:
      - annasetu-db2-data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_NAME:-ANNASETU}' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  annasetu-db2-data:
