# IBM Db2 Community Edition for local development.
# First start takes several minutes while the SAMPLE database is created:
#   docker compose up -d && docker compose logs -f db2   (wait for "Setup has completed")
services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: shipsafe-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      DBNAME: SAMPLE
      SAMPLEDB: "true"
    volumes:
      - db2data:/database
volumes:
  db2data:
