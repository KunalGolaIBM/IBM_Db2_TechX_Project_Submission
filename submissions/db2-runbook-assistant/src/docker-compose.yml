# Local Db2 for practice only (credentials below are not real secrets).
# Vector search needs Db2 12.1.2+.
# The FIRST start takes several minutes: watch `docker compose logs -f db2`
# and wait for "Setup has completed" before running ingest.py.
services:
  db2:
    image: icr.io/db2_community/db2:12.1.2.0
    container_name: db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD}
      DBNAME: RUNBOOKS
    volumes:
      - db2data:/database

volumes:
  db2data:
