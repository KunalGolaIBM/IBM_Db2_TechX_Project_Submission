version: "3.8"

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2_workrelay
    restart: unless-stopped
    privileged: true
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=YourSecurePassword123!
      - DBNAME=testdb
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
    ports:
      - "50000:50000"
    volumes:
      - db2_data:/database

  app:
    build: .
    container_name: workrelay_intelligence
    restart: unless-stopped
    depends_on:
      - db2
    environment:
      - DB2_HOST=db2
      - DB2_PORT=50000
      - DB2_DATABASE=testdb
      - DB2_USER=db2inst1
      - DB2_PASSWORD=YourSecurePassword123!
      - DB2_USE_MOCK=false
      - PORT=8000
    ports:
      - "8000:8000"

volumes:
  db2_data:
